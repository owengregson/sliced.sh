<!DOCTYPE html>
<!--
  HAND-BUILT FIXTURE (2026-09-04) from Appendix C §1.1–§1.5 verified DOM descriptions.
  Replace with a real capture of https://www.chess.com/play/computer during manual QA (Task 31).
  Scripts stripped. Vs-computer page: no clocks; bot card + top player row carry the bot rating.
  Position after 1.e4 e5 (white to move, ply 2).
  FEN: rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
-->
<html lang="en">
<head><meta charset="utf-8"><title>Play Chess vs Computer - Chess.com</title></head>
<body class="board-layout with-players with-controls">
<div id="board-layout-main" class="board-layout-main">
  <div id="board-layout-player-top" class="board-layout-player board-layout-top">
    <div class="player-component player-top">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-black">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">Nelson</a>
            <span class="cc-user-rating-black">(2000)</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="board-layout-chessboard" class="board-layout-chessboard">
    <wc-chess-board class="board" id="board-play-computer" style="--move-animation-duration: 180ms; width: 528px; height: 528px;">
      <svg class="coordinates" viewBox="0 0 100 100">
        <text class="coordinate-light" x="0.75" y="3.5">8</text>
      </svg>
      <div class="element-pool"></div>
      <div class="highlight square-57" style="background-color: rgb(16, 152, 61); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>
      <div class="highlight square-55" style="background-color: rgb(16, 152, 61); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>
      <div class="hover-square"></div>
      <div class="piece square-11 wr"></div>
      <div class="piece wn square-21"></div>
      <div class="piece wb square-31"></div>
      <div class="piece wq square-41"></div>
      <div class="piece wk square-51"></div>
      <div class="piece wb square-61"></div>
      <div class="piece wn square-71"></div>
      <div class="piece wr square-81"></div>
      <div class="piece wp square-12"></div>
      <div class="piece wp square-22"></div>
      <div class="piece wp square-32"></div>
      <div class="piece wp square-42"></div>
      <div class="piece wp square-54"></div>
      <div class="piece wp square-62"></div>
      <div class="piece wp square-72"></div>
      <div class="piece wp square-82"></div>
      <div class="piece br square-18"></div>
      <div class="piece bn square-28"></div>
      <div class="piece bb square-38"></div>
      <div class="piece bq square-48"></div>
      <div class="piece bk square-58"></div>
      <div class="piece bb square-68"></div>
      <div class="piece bn square-78"></div>
      <div class="piece br square-88"></div>
      <div class="piece bp square-17"></div>
      <div class="piece bp square-27"></div>
      <div class="piece bp square-37"></div>
      <div class="piece bp square-47"></div>
      <div class="piece bp square-55"></div>
      <div class="piece bp square-67"></div>
      <div class="piece bp square-77"></div>
      <div class="piece bp square-87"></div>
    </wc-chess-board>
  </div>
  <div id="board-layout-player-bottom" class="board-layout-player board-layout-bottom">
    <div class="player-component player-bottom">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-white">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">owen_g</a>
            <span class="cc-user-rating-white">(1650)</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="board-layout-sidebar" class="board-layout-sidebar">
    <div class="bot-component">
      <img class="bot-component-avatar" alt="">
      <div class="bot-component-name">Nelson</div>
      <div class="bot-component-rating">2000</div>
      <button data-cy="bot-selection-cta-button">Play</button>
    </div>
    <wc-simple-move-list class="mode-swap-move-list-wrapper-component move-list chessboard-pkg-move-list-component">
      <div class="timestamps-with-base-time">
        <div class="main-line-row move-list-row light-row" data-whole-move-number="1">1.
          <div data-node="0-0" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">e4 </span></div>
          <div data-node="0-1" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon selected">e5 </span></div>
        </div>
      </div>
    </wc-simple-move-list>
  </div>
</div>
</body>
</html>
