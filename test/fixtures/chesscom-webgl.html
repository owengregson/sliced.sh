<!DOCTYPE html>
<!--
  HAND-BUILT FIXTURE (2026-09-09) from the owner's live, logged-in capture of
  https://www.chess.com/game/174252022572 (first live test of the extension).

  chess.com renders the live board in WebGL: the board element is
  `wc-chess-board#board-single.board.board-webgl-2d`, its ONLY child is a
  <canvas>, and there are ZERO `.piece` elements and ZERO `div.element-pool`.
  Captured shape (verbatim from the probe):
    {"board":true,"id":"board-single","cls":"board board-webgl-2d",
     "canvasInBoard":1,"canvasOnPage":1,"pieces":0,"pool":0,
     "childTags":["CANVAS."],"hasGame":true,
     "fen":"rnbqkbnr/pp2pppp/2p5/8/4p3/3P1P2/PPP3PP/RNBQKBNR w KQkq - 0 4",
     "moveList":["wc-simple-move-list=1",".main-line-row=3",".node.main-line-ply=6"],
     "rect":{"w":704,"h":704}}

  So: `board.game` (the MAIN-world bridge) is the only position source, the move
  list DOM works once moves exist, and the player panels / clocks / sidebar are
  ordinary DOM outside the board element.

  A second capture, of a live game played as BLACK (/game/174252296142), adds:
    api: {"playingAs":2,"optionsFlipped":true,"turn":2}   (black at the bottom)
    dom: {"playerBottom":"player-component player-bottom",   ← NO colour class
          "clockBottom":"clock-component clock-bottom clock-black clock-player-turn",
          "clockTop":"clock-component clock-top clock-white",
          "boardClass":"board board-webgl-2d",             ← NO `flipped` class
          "rankTopToBottom":""}                            ← no SVG coordinates
  Hence: `getOptions().flipped` means "black at the bottom" (what geometry.ts
  means by flipped), the player panels carry no colour class, and the bottom
  clock's colour is the only DOM source for which colour is at the bottom. This
  fixture therefore has colourless `cc-user-block-component` panels and
  colour-bearing clocks, exactly as captured.

  Position after 1.e4 c6 2.d3 d5 3.f3 dxe4 (white to move, ply 6) — the capture's
  FEN and its move list, which replay to the same placement.
  Scripts stripped.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Play Chess Online - Chess.com</title></head>
<body class="board-layout with-players with-controls with-evaluation">
<div id="board-layout-main" class="board-layout-main">
  <div id="board-layout-player-top" class="board-layout-player board-layout-top">
    <div class="player-component player-top">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">CanvasKnight</a>
            <span class="cc-user-rating-black">(1712)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-top clock-black">
        <div class="clock-icon-icon"><svg class="clock-icon-timer"></svg></div>
        <span class="clock-time-monospace" role="timer">4:58</span>
      </div>
    </div>
  </div>
  <div id="board-layout-chessboard" class="board-layout-chessboard">
    <wc-chess-board class="board board-webgl-2d" id="board-single" style="width: 704px; height: 704px;"><canvas width="1408" height="1408" style="width: 704px; height: 704px;"></canvas></wc-chess-board>
  </div>
  <div id="board-layout-player-bottom" class="board-layout-player board-layout-bottom">
    <div class="player-component player-bottom">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">owen_g</a>
            <span class="cc-user-rating-white">(1650)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-bottom clock-white clock-player-turn">
        <div class="clock-icon-icon"><svg class="clock-icon-timer"></svg></div>
        <span class="clock-time-monospace" role="timer">4:41.2</span>
      </div>
    </div>
  </div>
  <div id="board-layout-sidebar" class="board-layout-sidebar">
    <wc-simple-move-list class="mode-swap-move-list-wrapper-component move-list chessboard-pkg-move-list-component">
      <div class="timestamps-with-base-time toggle-timestamps" style="--timeMaxValue:300; --timestampWidth:35px">
        <div class="main-line-row move-list-row light-row" data-whole-move-number="1">1.
          <div data-node="0-0" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">e4 </span></div>
          <div data-node="0-1" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">c6 </span></div>
          <div data-move-list-el="timestamp" data-ply="1" data-time="2" class="time-white">0.2s</div>
          <div data-move-list-el="timestamp" data-ply="2" data-time="3" class="time-black">0.3s</div>
        </div>
        <div class="main-line-row move-list-row dark-row" data-whole-move-number="2">2.
          <div data-node="0-2" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">d3 </span></div>
          <div data-node="0-3" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">d5 </span></div>
          <div data-move-list-el="timestamp" data-ply="3" data-time="4" class="time-white">0.4s</div>
          <div data-move-list-el="timestamp" data-ply="4" data-time="2" class="time-black">0.2s</div>
        </div>
        <div class="main-line-row move-list-row light-row" data-whole-move-number="3">3.
          <div data-node="0-4" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">f3 </span></div>
          <div data-node="0-5" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon selected">dxe4 </span></div>
          <div data-move-list-el="timestamp" data-ply="5" data-time="6" class="time-white">0.6s</div>
          <div data-move-list-el="timestamp" data-ply="6" data-time="4" class="time-black">0.4s</div>
        </div>
      </div>
    </wc-simple-move-list>
  </div>
</div>
</body>
</html>
