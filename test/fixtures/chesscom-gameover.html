<html lang="en">
<head><meta charset="utf-8"><title>Play Chess Online - Chess.com</title></head>
<body class="board-layout with-players with-controls with-evaluation">
<div id="board-layout-main" class="board-layout-main">
  <div id="board-layout-player-top" class="board-layout-player board-layout-top">
    <div class="player-component player-top">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-black">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">MagnusFan99</a>
            <span class="cc-user-rating-black">(1842)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-top clock-black">
        <span class="clock-time-monospace" role="timer">2:41</span>
      </div>
    </div>
  </div>
  <div id="board-layout-chessboard" class="board-layout-chessboard">
    <wc-chess-board class="board" id="board-single" style="--move-animation-duration: 180ms; width: 528px; height: 528px;">
      <svg class="coordinates" viewBox="0 0 100 100"><text class="coordinate-light" x="0.75" y="3.5">8</text></svg>
      <div class="element-pool"></div>
      <div class="highlight square-85" style="background-color: rgb(255, 255, 51); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>
      <div class="highlight square-67" style="background-color: rgb(255, 255, 51); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>

      <div class="piece wb square-31"></div>
      <div class="piece wk square-51"></div>

      <div class="piece wp square-22"></div>
      <div class="piece wp square-32"></div>
      <div class="piece wp square-42"></div>
      <div class="piece wp square-62"></div>
      <div class="piece wp square-72"></div>
      <div class="piece wp square-82"></div>
      <div class="piece wp square-54"></div>
      <div class="piece wb square-34"></div>
      <div class="piece wq square-67"></div>

      <div class="piece bp square-55"></div>
      <div class="piece bn square-36"></div>
      <div class="piece bn square-66"></div>

    <div class="board-modal-container-container">
      <div class="game-over-modal-shell-container">
        <div class="game-over-modal-shell-content game-over-modal-shell-v6">
          <div class="game-over-modal-header-component game-over-modal-header-userWon">
            <div class="game-over-modal-title-component">You Won!</div>
            <div class="game-over-modal-subtitle-component">by checkmate</div>
          </div>
          <div class="game-over-modal-shell-buttons">
            <button class="cc-button-component" data-cy="game-over-modal-new-game-button" aria-label="New Game">New 3 min</button>
            <button class="cc-button-component" data-cy="game-over-modal-rematch-button" aria-label="Rematch">Rematch</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="board-layout-player-bottom" class="board-layout-player board-layout-bottom">
    <div class="player-component player-bottom">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-white">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">owen_g</a>
            <span class="cc-user-rating-white">(1658)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-bottom clock-white">
        <span class="clock-time-monospace" role="timer">2:48</span>
      </div>
    </div>
  </div>
  <div id="board-layout-sidebar" class="board-layout-sidebar">

      </div>
    </div>
    <wc-simple-move-list class="mode-swap-move-list-wrapper-component move-list chessboard-pkg-move-list-component">
      <div class="timestamps-with-base-time">
        <div class="main-line-row move-list-row light-row" data-whole-move-number="1">1.
          <div data-node="0-0" class="node white-move main-line-ply"><span class="node-highlight-content">e4 </span></div>
          <div data-node="0-1" class="node black-move main-line-ply"><span class="node-highlight-content">e5 </span></div>

        </div>
        <div class="main-line-row move-list-row dark-row" data-whole-move-number="4">4.
          <div data-node="0-6" class="node white-move main-line-ply"><span class="node-highlight-content selected">Qxf7# </span></div>
        </div>
        <div class="main-line-row move-list-row result-row"><span class="game-result">1-0 </span></div>
      </div>
    </wc-simple-move-list>
  </div>
</div>
