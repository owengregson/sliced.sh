  Replace with a real capture of https://www.chess.com/game/live/<id> during manual QA (Task 31).

<html lang="en">
<head><meta charset="utf-8"><title>Play Chess Online - Chess.com</title></head>
<body class="board-layout with-players with-controls with-evaluation">
<div id="board-layout-main" class="board-layout-main">
  <div id="board-layout-player-top" class="board-layout-player board-layout-top">
    <div class="player-component player-top">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-black">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">MagnusFan99</a>
            <span class="cc-user-rating-black">(1850)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-top clock-black">
        <div class="clock-icon-icon"><svg class="clock-icon-timer"></svg></div>
        <span class="clock-time-monospace" role="timer">2:59</span>
      </div>
    </div>
  </div>
  <div id="board-layout-chessboard" class="board-layout-chessboard">
    <wc-chess-board class="board" id="board-single" style="--move-animation-duration: 180ms; width: 528px; height: 528px;">
      <svg class="coordinates" viewBox="0 0 100 100">
        <text class="coordinate-light" x="0.75" y="3.5">8</text>
        <text class="coordinate-dark" x="0.75" y="15.75">7</text>
      </svg>
      <div class="element-pool"></div>
      <div class="highlight square-17" style="background-color: rgb(255, 255, 51); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>
      <div class="highlight square-16" style="background-color: rgb(255, 255, 51); opacity: 0.5;" data-test-element="highlight" data-test-type="highlight"></div>
      <div class="hover-square"></div>
      <div class="piece square-11 wr" style=""></div>
      <div class="piece wn square-21" style=""></div>
      <div class="piece wb square-31" style=""></div>
      <div class="piece square-41 wq" style=""></div>
      <div class="piece wk square-51" style=""></div>
      <div class="piece square-81 wr" style=""></div>
      <div class="piece wp square-12" style=""></div>
      <div class="piece wp square-22" style=""></div>
      <div class="piece wp square-32" style=""></div>
      <div class="piece wp square-42" style=""></div>
      <div class="piece square-62 wp" style=""></div>
      <div class="piece wp square-72" style=""></div>

      <div class="piece bb square-68" style=""></div>
      <div class="piece bn square-78" style=""></div>
      <div class="piece br square-88" style=""></div>
      <div class="piece bp square-27" style=""></div>
      <div class="piece bp square-37" style=""></div>
      <div class="piece square-47 bp" style=""></div>
      <div class="piece bp square-67" style=""></div>
      <div class="piece bp square-77" style=""></div>
      <div class="piece bp square-87" style=""></div>
      <div class="piece bp square-16" style=""></div>
      <div class="piece square-36 bn" style=""></div>
      <div class="piece bp square-55" style=""></div>
    </wc-chess-board>
  </div>
  <div id="board-layout-player-bottom" class="board-layout-player board-layout-bottom">
    <div class="player-component player-bottom">
      <div class="player-playerContent">
        <div class="player-tagline">
          <div class="cc-user-block-component cc-user-block-white">
            <a class="cc-user-username-component" data-test-element="user-tagline-username">owen_g</a>
            <span class="cc-user-rating-white">(1650)</span>
          </div>
        </div>
      </div>
      <div class="clock-component clock-bottom clock-white clock-player-turn">
        <div class="clock-icon-icon"><svg class="clock-icon-timer"></svg></div>
        <span class="clock-time-monospace" role="timer">0:16.0</span>
      </div>
    </div>
  </div>
  <div id="board-layout-sidebar" class="board-layout-sidebar">
    <wc-simple-move-list class="mode-swap-move-list-wrapper-component move-list chessboard-pkg-move-list-component">
      <div class="timestamps-with-base-time toggle-timestamps" style="--timeMaxValue:320; --timestampWidth:35px">
        <div class="main-line-row move-list-row light-row" data-whole-move-number="1">1.
          <div data-node="0-0" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">e4 </span></div>
          <div data-node="0-1" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon">e5 </span></div>

          <div data-move-list-el="timestamp" data-ply="2" data-time="1" class="time-black">0.1s</div>
        </div>
        <div class="main-line-row move-list-row dark-row" data-whole-move-number="2">2.
          <div data-node="0-2" class="node white-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon"><span class="icon-font-chess knight-white" data-figurine="N"></span>f3 </span></div>
          <div data-node="0-3" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon"><span class="icon-font-chess knight-black" data-figurine="N"></span>c6 </span></div>

          <div data-node="0-5" class="node black-move main-line-ply"><span class="node-highlight-content offset-for-annotation-icon selected">a6 </span></div>
          <div data-move-list-el="timestamp" data-ply="5" data-time="5" class="time-white">0.5s</div>
          <div data-move-list-el="timestamp" data-ply="6" data-time="3" class="time-black">0.3s</div>
        </div>
      </div>
    </wc-simple-move-list>
  </div>
