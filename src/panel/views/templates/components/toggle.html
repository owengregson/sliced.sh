<button class="sl-toggle" type="button" role="switch" aria-checked="false" data-state="off">
	<span class="sl-toggle__track" aria-hidden="true">
		<span class="sl-toggle__fill"></span>
		<span class="sl-toggle__thumb"><i class="sl-icon sl-toggle__lock" data-icon="feedback.locked" hidden></i></span>
	</span>
	<i class="sl-icon sl-toggle__icon" hidden></i>
	<span class="sl-toggle__label"></span>
	<span class="sl-toggle__hint sl-type-label" hidden></span>
</button>
