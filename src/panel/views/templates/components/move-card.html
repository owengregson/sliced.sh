<article class="sl-move" data-state="thinking">
	<div class="sl-move__header sl-type-label"></div>
	<div class="sl-move__hero">
		<div class="sl-move__san sl-type-move-lg"></div>
		<div class="sl-move__uci sl-type-mono"></div>
		<span class="sl-move__loader" aria-hidden="true"><i></i><i></i><i></i></span>
	</div>
	<div class="sl-move__notice"><div class="sl-move__note sl-type-label" hidden></div></div>
	<div class="sl-move__plan sl-type-label" hidden>
		<span class="sl-move__plan-text"></span>
		<span class="sl-move__plan-ring"></span>
	</div>
	<div class="sl-move__progress">
		<div class="sl-move__progress-summary">
			<span class="sl-move__progress-label"></span>
			<span class="sl-move__progress-value sl-text-numerals"></span>
		</div>
		<div class="sl-move__progress-track" role="progressbar">
			<span class="sl-move__progress-fill"></span>
		</div>
	</div>
	<div class="sl-move__action"></div>
	<div class="sl-move__live sl-visually-hidden" aria-live="polite"></div>
</article>
