<!-- biome-ignore lint/a11y/noLabelWithoutControl: the label text is filled from copy at mount; the control is nested -->
<label class="sl-input">
	<span class="sl-input__label sl-type-label"></span>
	<span class="sl-input__field">
		<input class="sl-input__control" type="text" autocomplete="off" spellcheck="false" />
		<button class="sl-input__trailing" type="button" hidden><i class="sl-icon"></i></button>
	</span>
	<span class="sl-input__hint sl-type-label" hidden></span>
</label>
