<div class="sl-slider">
	<div class="sl-slider__row">
		<div class="sl-slider__track">
			<div class="sl-slider__fill">
				<span class="sl-slider__glow" aria-hidden="true"></span>
				<span class="sl-slider__energy" aria-hidden="true"><span></span></span>
			</div>
			<span class="sl-slider__ticks" aria-hidden="true"></span>
			<span class="sl-slider__divider" aria-hidden="true" hidden></span>
			<div class="sl-slider__thumb" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
				<div class="sl-slider__bubble sl-type-label" aria-hidden="true"></div>
			</div>
		</div>
		<output class="sl-slider__value sl-type-mono sl-text-numerals"></output>
	</div>
	<div class="sl-slider__boundary sl-type-label" hidden>
		<span class="sl-slider__lower-label"></span>
		<span class="sl-slider__threshold-label sl-text-numerals"></span>
		<span class="sl-slider__upper-label"></span>
	</div>
	<div class="sl-slider__scale sl-type-label" aria-hidden="true" hidden></div>
	<div class="sl-slider__hint sl-type-label" hidden></div>
</div>
