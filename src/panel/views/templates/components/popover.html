<div class="sl-popover" role="dialog" tabindex="-1" data-state="opening">
	<span class="sl-popover__arrow" aria-hidden="true"></span>
	<div class="sl-popover__header">
		<span class="sl-popover__title sl-type-title"></span>
		<button class="sl-popover__close sl-button sl-button--ghost sl-button--sm" type="button"><i class="sl-icon sl-button__icon" data-icon="action.close"></i></button>
	</div>
	<div class="sl-popover__body"></div>
	<div class="sl-popover__footer sl-type-label" hidden></div>
