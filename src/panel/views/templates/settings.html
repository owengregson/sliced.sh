<section class="sl-view sl-settings" data-view="settings">
	<header class="sl-page-heading">
		<!-- biome-ignore lint/a11y/useHeadingContent: filled from copy.ts at mount -->
		<h1 class="sl-settings__title"></h1>
		<p class="sl-settings__intro"></p>
	</header>
	<div class="sl-settings__search-row">
		<input class="sl-settings__search" type="search" />
		<span class="sl-settings__save" role="status"></span>
	</div>
	<p class="sl-settings__empty" role="status" hidden></p>
	<nav class="sl-settings__jump"></nav>
	<div class="sl-settings__sections"></div>
	<footer class="sl-settings__footer sl-type-label">
		<div class="sl-settings__footer-version"></div>
		<div class="sl-settings__footer-notice" data-notice="engine"></div>
		<div class="sl-settings__footer-notice" data-notice="timing"></div>
	</footer>
</section>
