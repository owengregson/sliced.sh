<section class="sl-view sl-login" data-view="login">
	<div class="sl-login__hero">
		<img class="sl-login__mark" alt="" width="64" height="64" />
		<!-- biome-ignore lint/a11y/useHeadingContent: filled from copy.ts at mount -->
		<h1 class="sl-view__title sl-login__wordmark sl-type-title"></h1>
		<p class="sl-login__tagline sl-type-body"></p>
	</div>
	<form class="sl-login__form" novalidate>
		<div class="sl-login__field"></div>
		<div class="sl-login__extra" hidden></div>
		<div class="sl-login__submit"></div>
		<p class="sl-login__link sl-type-body">
			<span class="sl-login__link-text"></span>
			<button class="sl-login__link-button" type="button" data-action="open-url" data-url="website"><i class="sl-icon" data-icon="action.external"></i></button>
		</p>
	</form>
	<div class="sl-login__spacer" aria-hidden="true"></div>
	<footer class="sl-login__footer sl-type-label">
		<span class="sl-login__version"></span>
		<button class="sl-login__discord" type="button" data-action="open-url" data-url="discord"><i class="sl-icon" data-icon="social.discord"></i><span class="sl-login__discord-label"></span></button>
	</footer>
</section>
